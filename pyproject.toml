[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-auditer"
version = "0.1.0"
description = "CLI tool for auditing and managing GitHub repositories across personal and organisation accounts"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
auditer = "auditer.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "black>=24.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auditer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]
